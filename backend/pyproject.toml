[project]
name = "cex-backend"
version = "0.1.0"
description = "Centralized Crypto Exchange Simulator - Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "redis[hiredis]>=5.0.0",
    "aiokafka>=0.10.0",
    "celery>=5.3.6",
    "redis>=5.0.0",
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<5",
    "python-multipart>=0.0.6",
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4.2",
    "httpx>=0.26.0",
    "httpx-ws>=0.6.0",
    "tenacity>=8.2.0",
    "elasticsearch[async]>=8.11.0",
    "openai>=1.6.0",
    "orjson>=3.9.0",
    "python-dateutil>=2.8.2",
    "pybreaker>=0.6.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "factory-boy>=3.3.0",
    "httpx>=0.26.0",
    "locust>=2.20.0",
    "ipython>=8.18.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "SIM"]
ignore = ["UP017", "UP035", "UP042", "SIM108", "SIM102", "SIM103", "SIM105", "E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
